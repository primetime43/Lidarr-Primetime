name: Sync upstream Lidarr

on:
  schedule:
    - cron: '25 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-lidarr
  cancel-in-progress: false

env:
  FORK_BRANCH: develop
  SYNC_BRANCH: automation/sync-upstream

jobs:
  sync:
    if: github.event.repository.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Merge upstream into a proposed update
        id: merge
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/Lidarr/Lidarr.git develop
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c "$SYNC_BRANCH"
          if ! git merge --no-edit FETCH_HEAD; then
            git merge --abort
            echo '::error::Upstream changes conflict with the fork. Resolve the merge locally; develop has not been changed.'
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        if: steps.merge.outputs.changed == 'true'
        with:
          global-json-file: global.json
      - name: Check migration versions
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          duplicates="$(sed -nE 's/.*\[Migration\(([0-9]+)\).*/\1/p' src/NzbDrone.Core/Datastore/Migration/*.cs | awk '{print $0 + 0}' | sort -n | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "::error::Upstream and fork database migrations conflict: $duplicates"
            exit 1
          fi
      - name: Test the merged song download behavior
        if: steps.merge.outputs.changed == 'true'
        run: >-
          dotnet test src/NzbDrone.Core.Test/Lidarr.Core.Test.csproj
          --configuration Debug
          -p:SolutionDir="${{ github.workspace }}/src/"
          -p:RuntimeIdentifiers=linux-x64
          --filter 'FullyQualifiedName~IndexerSearchTests|FullyQualifiedName~NewznabRequestGeneratorFixture|FullyQualifiedName~ParsingServiceTests|FullyQualifiedName~AcceptableSizeSpecificationFixture|FullyQualifiedName~PrioritizeDownloadDecisionFixture|FullyQualifiedName~QueueSpecificationFixture|FullyQualifiedName~CompletedDownloadServiceTests|FullyQualifiedName~TrackedDownloadAlreadyImportedFixture|FullyQualifiedName~DownloadApprovedFixture|FullyQualifiedName~DownloadedTracksImportServiceFixture|FullyQualifiedName~ImportApprovedTracksFixture|FullyQualifiedName~MonitoredTrackSpecificationFixture|FullyQualifiedName~HistoryTests'
      - name: Open or update the upstream pull request
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force-with-lease origin "HEAD:refs/heads/$SYNC_BRANCH"
          number="$(gh pr list --base "$FORK_BRANCH" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create --base "$FORK_BRANCH" --head "$SYNC_BRANCH" \
              --title 'Merge upstream Lidarr develop updates' \
              --body 'Merge the current Lidarr/Lidarr develop branch while retaining the fork features. Song Mode regression tests and migration version checks passed on this merge. Review upstream changes and deployment compatibility before merging.'
          fi
